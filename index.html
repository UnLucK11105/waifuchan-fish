<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рыбалка Вайфучан — Калькулятор и Справочник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="header-inner">
      <div>
        <h1>Рыбалка Вайфучан by UnLucK1 & Yukio_twinZ</h1>
        <div class="subtitle" id="statusText">Загрузка данных…</div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button type="button" class="tab active" id="tCalc" onclick="setTab('calc')">🧮 По наживке</button>
    <button type="button" class="tab" id="tRev" onclick="setTab('rev')">🎯 Где ловить рыбу</button>
    <button type="button" class="tab" id="tDex" onclick="setTab('dex')">📖 Справочник (64)</button>
  </div>

  <!-- ВКЛАДКА 1 -->
  <div id="pCalc" class="panel active">
    <div class="controls">
      <div>
        <label>Время суток</label>
        <select id="selTime" onchange="renderCalc()">
          <option value="Любое">🕐 Любое время</option>
          <option value="Утро">🌅 Утро</option>
          <option value="День">☀️ День</option>
          <option value="Вечер">🌇 Вечер</option>
          <option value="Ночь" selected>🌙 Ночь</option>
        </select>
      </div>
      <div>
        <label>Наживка</label>
        <select id="selBait" onchange="renderCalc()">
          <option value="Любое">🎣 Любая наживка</option>
          <option value="Магнит" selected>🧲 Магнит</option>
          <option value="Лунная приманка">🌙 Лунная приманка</option>
          <option value="Криль">🦐 Криль</option>
          <option value="Блесна">🪝 Блесна</option>
          <option value="Креветка">🍤 Креветка</option>
          <option value="Червь">🪱 Червь</option>
          <option value="Мотыль">🦟 Мотыль</option>
          <option value="Хлеб">🍞 Хлеб</option>
          <option value="Корм для рыбок">🥫 Корм для рыбок</option>
          <option value="Перламутровая">✨ Перламутровая</option>
          <option value="Светлячок">💡 Светлячок</option>
        </select>
      </div>
      <div>
        <label>Прикормка</label>
        <select id="selChum" onchange="renderCalc()">
          <option value="Любая" selected>📊 Все прикормки</option>
          <option value="Крупная">🥩 Крупная</option>
          <option value="Пахучая">🧪 Пахучая</option>
          <option value="Хлебная">🌾 Хлебная</option>
          <option value="Без">🚫 Без прикормки</option>
        </select>
      </div>
    </div>
    <div id="hintBox" class="alert-box" style="display:none"></div>
    <div id="calcPills" class="stats-bar"></div>
    <div id="calcRows" class="drop-list"></div>
  </div>

  <!-- ВКЛАДКА 2 -->
  <div id="pRev" class="panel">
    <div class="controls">
      <div class="search-wrap">
        <label for="fishSearch">Найди рыбу или сокровище — введи название</label>
        <input type="text" id="fishSearch" placeholder="Начни вводить название, например «карп»…" oninput="filterFishOptions()" autocomplete="off">
        <div class="sel-wrap">
          <label for="selFish">Или выбери из списка</label>
          <select id="selFish" onchange="onFishSelect()"></select>
        </div>
      </div>
    </div>
    <div id="revCard"></div>
    <div id="revRows" class="drop-list gap-top"></div>
  </div>

  <!-- ВКЛАДКА 3 -->
  <div id="pDex" class="panel">
    <div class="controls">
      <div>
        <label for="qSearch">Поиск по названию</label>
        <input type="text" id="qSearch" placeholder="Начни вводить название…" oninput="renderDex()" autocomplete="off">
      </div>
      <div>
        <label for="qRar">Редкость</label>
        <select id="qRar" onchange="renderDex()">
          <option value="Все">Все редкости</option>
          <option value="Легендарная">🟡 Легендарная</option>
          <option value="Эпическая">🟣 Эпическая</option>
          <option value="Редкая">🔵 Редкая</option>
          <option value="Необычная">🟢 Необычная</option>
          <option value="Обычная">⚪ Обычная</option>
        </select>
      </div>
    </div>
    <div id="dexGrid" class="grid"></div>
  </div>
</div>

<script>
const WORKER_URL = "https://script.google.com/macros/s/AKfycbySMLiPodiNzGwaAemDVPCJfkeoUlHrQ14tZVRsxqvOMIGrhENjn1ITlBAKHEVh6mCu/exec";
const PUBLISHED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXiFLUMG-vxqP2_TuYsDuSuCxU2sZ1JNmVEgTq9rvwPjEqNcYDZ4bT8Tx_xkYtVjSCRKRPImVRwU0D/pub?gid=235959870&single=true&output=csv";

const RAW = [
  "Плотва|Обычная|Утро/день/вечер|Любая","Карась|Обычная|Любое|Любая",
  "Уклейка|Обычная|Утро/день|Любая","Ёрш|Обычная|Любое|Любая",
  "Густера|Обычная|Вечер/ночь|Любая","Елец|Обычная|Утро/вечер|Любая",
  "Пескарь|Обычная|Утро/день|Любая","Ротан|Обычная|День/вечер|Любая",
  "Краснопёрка|Обычная|День/вечер|Любая","Лягушка|Обычная|Утро/вечер|Любая",
  "Щука|Необычная|Утро/вечер|Любая","Синец|Необычная|Утро/вечер|Любая",
  "Язь|Необычная|Утро/вечер|Любая","Налим|Необычная|Ночь|Любая",
  "Хариус|Необычная|Утро/вечер|Любая","Креветка|Необычная|Любое|Любая",
  "Черепаха|Необычная|День/вечер|Любая","Краб|Необычная|Утро/вечер/Ночь|Любая",
  "Ракушка|Необычная|Любое|Любая","Тропик|Необычная|Утро/день|Любая",
  "Иглобрюх|Необычная|Любое|Любая","Шестиполосый Дистиход|Необычная|День|Любая",
  "Нильский слоник|Необычная|Вечер/ночь|Любая","Карп|Редкая|Утро/вечер/Ночь|Любая",
  "Микижа|Редкая|Утро/вечер|Любая","Жерех|Редкая|Утро/день|Любая",
  "Карп кои|Редкая|Утро/день|Любая","Выдра|Редкая|Утро/день|Любая",
  "Устрица|Редкая|Любое|Любая","Пиранья|Редкая|День|Любая",
  "Осьминог|Редкая|Вечер/ночь|Любая","Лобстер|Редкая|Вечер/ночь|Любая",
  "Павлинний басс|Редкая|День|Любая","Тетрадон мбу|Редкая|День/вечер|Любая",
  "Кальмар|Редкая|Ночь|Любая","Медуза|Редкая|Вечер/ночь|Любая",
  "Осётр|Эпическая|Утро/Ночь|Любая","Толстолобик|Эпическая|День|Любая",
  "Нерка|Эпическая|Утро/вечер|Любая","Удильщик|Эпическая|Ночь|Любая",
  "Акула|Эпическая|День/вечер|Любая","Тюлень|Эпическая|Утро/день|Любая",
  "Кит|Эпическая|Утро/вечер/Ночь|Любая","Рыба-капля|Эпическая|Ночь|Любая",
  "Крокодил|Эпическая|Вечер/ночь|Любая","Дельфин|Эпическая|Утро/день|Любая",
  "Золотая рыбка|Эпическая|Утро/вечер|Любая","Мегалодон|Легендарная|День/вечер|Блесна",
  "Речной дракон|Легендарная|Ночь|Лунная приманка","Голубой кит|Легендарная|Утро|Криль",
  "Рыба-ктулху|Легендарная|Ночь|Лунная приманка","Консервная банка|Обычная|Любое|Любая",
  "Носок|Обычная|Любое|Любая","Зонтик|Необычная|Любое|Любая",
  "Ботинок|Необычная|Любое|Любая","Чей-то телефон|Редкая|Любое|Любая",
  "Бутылка с запиской|Необычная|Любое|Любая","Серебряная монета|Редкая|Любое|Любая",
  "Амфора|Редкая|День|Любая","Старый ключ|Редкая|Ночь|Любая",
  "Якорь|Эпическая|Любое|Любая","Кольцо|Эпическая|Вечер|Любая",
  "Корона|Легендарная|Любое|Магнит","Трезубец|Легендарная|Ночь|Магнит/Лунная приманка"
];

const DB = RAW.map(s => { const [name, rar, time, bait] = s.split('|'); return { name, rar, time, bait }; });
const RMAP = {}; DB.forEach(x => RMAP[x.name.toLowerCase()] = x.rar);
let logs = [];

function thumbHtml(name) {
  return `<div class="fish-thumb"><span>🐟</span><img src="img/${encodeURIComponent(name)}.webp" onload="this.previousElementSibling.remove()" onerror="this.remove()"></div>`;
}
function setTab(id) {
  ['Calc','Rev','Dex'].forEach(k => {
    document.getElementById('t'+k).classList.toggle('active', k.toLowerCase() === id);
    document.getElementById('p'+k).classList.toggle('active', k.toLowerCase() === id);
  });
  if (id === 'rev') renderRev();
  if (id === 'dex') renderDex();
}

function renderCalc() {
  const t = document.getElementById('selTime').value;
  const b = document.getElementById('selBait').value;
  const c = document.getElementById('selChum').value;

  const hb = document.getElementById('hintBox');
  let h = "";
  if (b === "Лунная приманка" && t !== "Ночь" && t !== "Любое") {
    h = "⚠️ <b>Лунная приманка</b> работает полноценно только <b>Ночью</b>.";
  } else if (b === "Криль" && t !== "Утро" && t !== "Любое") {
    h = "⚠️ <b>Криль</b> предназначен для ловли <b>Утром</b> (Голубой кит, Тюлень).";
  } else if (b === "Перламутровая" || b === "Светлячок") {
    h = "💡 <b>Перламутровая</b> и <b>Светлячок</b> в текущей версии игры не дают бонуса (задуманы под Шайни).";
  }
  hb.style.display = h ? 'block' : 'none';
  hb.innerHTML = h;

  const pEl = document.getElementById('calcPills');
  const rEl = document.getElementById('calcRows');
  if (!logs.length) {
    pEl.innerHTML = `<div class="stat-pill">⏳ Данные ещё не загружены — проверь доступ к таблице.</div>`;
    rEl.innerHTML = "";
    return;
  }

  const isAnyTime = (t === "Любое");
  const isAnyBait = (b === "Любое");
  const isAnyChum = (c === "Любая");

  const f = logs.filter(r =>
    (isAnyTime || r.t.toLowerCase() === t.toLowerCase()) &&
    (isAnyBait || r.b.toLowerCase() === b.toLowerCase()) &&
    (isAnyChum || r.c.toLowerCase() === c.toLowerCase())
  );

  if (!f.length) {
    pEl.innerHTML = `<div class="stat-pill">Замеров: <b>0</b> (попробуй «Все прикормки» или «Любое время / наживку»)</div>`;
    rEl.innerHTML = "";
    return;
  }

  let ch = 0, sh = 0;
  const cnt = {};
  f.forEach(r => {
    cnt[r.u] = (cnt[r.u] || 0) + 1;
    if (r.ch) ch++;
    if (r.sh) sh++;
  });

  const timeDesc = isAnyTime ? "все времена" : t;
  const baitDesc = isAnyBait ? "все наживки" : b;
  const chumDesc = isAnyChum ? "все прикормки" : c;

  const filterPill = (isAnyTime || isAnyBait || isAnyChum)
    ? `<div class="stat-pill">🔎 <b>${timeDesc}</b> · <b>${baitDesc}</b> · <b>${chumDesc}</b></div>`
    : "";

  pEl.innerHTML = `
    ${filterPill}
    <div class="stat-pill">Выборка: <b>${f.length} забросов</b></div>
    <div class="stat-pill">📦 Сундук: <b>${(ch / f.length * 100).toFixed(1)}%</b> (${ch})</div>
    <div class="stat-pill">✨ Шайни: <b>${(sh / f.length * 100).toFixed(1)}%</b> (${sh})</div>
    <div class="stat-pill">🐟 Видов: <b>${Object.keys(cnt).length}</b></div>
  `;

  const srt = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const mx = srt[0][1];

  rEl.innerHTML = srt.map(([nm, n]) => {
    const pct = (n / f.length * 100).toFixed(1);
    const rar = RMAP[nm.toLowerCase()] || "Обычная";
    const w = Math.round(n / mx * 100);
    return `
      <div class="drop-row">
        <div class="drop-info">
          <span class="badge bg-${rar}">${rar}</span>
          <b>${nm}</b>
        </div>
        <div class="bar-wrap"><div class="bar-fill fill-${rar}" style="width:${w}%"></div></div>
        <div class="r-${rar}">${pct}% (${n})</div>
      </div>`;
  }).join('');
}

function filterFishOptions() {
  const q = document.getElementById('fishSearch').value.toLowerCase().trim();
  const sel = document.getElementById('selFish');
  const prev = sel.value;
  const options = q ? DB.filter(x => x.name.toLowerCase().includes(q)) : DB;

  if (!options.length) {
    sel.innerHTML = '<option value="">— ничего не найдено —</option>';
    document.getElementById('revCard').innerHTML = `<div class="stat-pill">По запросу «${q}» ничего нет. Попробуй иначе.</div>`;
    document.getElementById('revRows').innerHTML = '';
    return;
  }

  sel.innerHTML = options.map(x => `<option value="${x.name}">${x.name} (${x.rar})</option>`).join('');
  if (options.some(x => x.name === prev)) {
    sel.value = prev;
  } else {
    sel.value = options[0].name;
  }
  renderRev();
}
function onFishSelect() { renderRev(); }

function renderRev() {
  const sel = document.getElementById('selFish');
  const fishName = sel.value;
  const item = DB.find(x => x.name === fishName) || DB[0];
  if (!item) return;

  const cardEl = document.getElementById('revCard');
  const rowsEl = document.getElementById('revRows');
  const totalCaught = logs.filter(r => r.u.toLowerCase() === item.name.toLowerCase()).length;

  cardEl.innerHTML = `
    <div class="card rev-card">
      <div class="card-header">
        ${thumbHtml(item.name)}
        <div class="rev-inner">
          <div class="rev-title-row">
            <b class="rev-title r-${item.rar}">${item.name}</b>
            <span class="badge bg-${item.rar}">${item.rar}</span>
          </div>
          <div class="rev-meta">
            <span>🕒 Время: <b>${item.time}</b></span>
            <span>🪝 Наживка: <b>${item.bait}</b></span>
            <span>📊 Поймано: <b>${totalCaught} раз</b></span>
          </div>
        </div>
      </div>
    </div>`;

  if (!logs.length) { rowsEl.innerHTML = `<div class="stat-pill">Данные ещё не загружены</div>`; return; }

  const grp = {};
  logs.forEach(r => {
    const k = `${r.t} + ${r.b} (${r.c})`;
    if (!grp[k]) grp[k] = { total: 0, hit: 0 };
    grp[k].total++;
    if (r.u.toLowerCase() === item.name.toLowerCase()) grp[k].hit++;
  });
  const ranked = Object.entries(grp).filter(([, v]) => v.hit > 0)
    .map(([k, v]) => ({ k, hit: v.hit, total: v.total, rate: v.hit / v.total }))
    .sort((a, b) => b.rate - a.rate || b.hit - a.hit);

  if (!ranked.length) { rowsEl.innerHTML = `<div class="stat-pill">В загруженных логах этот вид пока не попадался</div>`; return; }

  const mx = ranked[0].rate;
  rowsEl.innerHTML = ranked.map(x => `
    <div class="drop-row">
      <div class="drop-info"><b>${x.k}</b></div>
      <div class="bar-wrap"><div class="bar-fill fill-${item.rar}" style="width:${Math.round(x.rate / mx * 100)}%"></div></div>
      <div class="r-${item.rar}">${(x.rate * 100).toFixed(1)}% (${x.hit}/${x.total})</div>
    </div>`).join('');
}

function renderDex() {
  const q = document.getElementById('qSearch').value.toLowerCase().trim();
  const rf = document.getElementById('qRar').value;
  const tot = {}, grp = {};
  logs.forEach(r => {
    const u = r.u.toLowerCase();
    tot[u] = (tot[u] || 0) + 1;
    const k = `${r.t} + ${r.b} (${r.c})`;
    if (!grp[k]) grp[k] = { total: 0, hits: {} };
    grp[k].total++; grp[k].hits[u] = (grp[k].hits[u] || 0) + 1;
  });
  document.getElementById('dexGrid').innerHTML = DB
    .filter(i => i.name.toLowerCase().includes(q) && (rf === "Все" || i.rar === rf))
    .map(i => {
      const u = i.name.toLowerCase();
      let bk = "Загрузи данные", br = 0;
      if (logs.length) {
        bk = "Не поймано в логах";
        for (const [k, v] of Object.entries(grp)) {
          const hit = v.hits[u] || 0;
          if (hit > 0 && (hit / v.total) > br) {
            br = hit / v.total;
            bk = `${k} — <b>${(br * 100).toFixed(1)}%</b> (${hit}/${v.total})`;
          }
        }
      }
      return `
        <div class="card">
          <div>
            <div class="card-header">
              ${thumbHtml(i.name)}
              <div>
                <div class="dex-title r-${i.rar}">${i.name}</div>
                <span class="badge bg-${i.rar}">${i.rar}</span>
              </div>
            </div>
            <div class="dex-meta">
              <div>🕒 <b>Время:</b> ${i.time}</div>
              <div>🪝 <b>Наживка:</b> ${i.bait}</div>
              <div>📊 <b>Поймано:</b> ${tot[u] || 0} раз</div>
            </div>
          </div>
          <div class="best-combo">🔥 <b>Топ:</b> ${bk}</div>
        </div>`;
    }).join('');
}

function parseRawText(raw) {
  const clean = raw.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/);
  const out = [];
  const validTimes = new Set(["утро", "день", "вечер", "ночь"]);
  for (const ln0 of lines) {
    const ln = ln0.trim();
    if (!ln) continue;
    let sep = ',';
    if (ln.includes('\t')) sep = '\t';
    else if (ln.includes(';')) sep = ';';
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const t = c[0] || "";
    const b = c[1] || "";
    const chm = c[2] || "Без";
    const u = c[3] || "";
    const chestRaw = (c[4] || "").toLowerCase();
    const shinyRaw = (c[6] || "").toLowerCase();
    if (validTimes.has(t.toLowerCase()) && b && u) {
      out.push({
        t: t[0].toUpperCase() + t.slice(1).toLowerCase(),
        b, c: chm || "Без", u,
        ch: chestRaw === "true" || chestRaw === "1" || chestRaw === "истина",
        sh: shinyRaw === "true" || shinyRaw === "1" || shinyRaw === "истина"
      });
    }
  }
  return out;
}

function applyData(parsed, sourceLabel) {
  if (!parsed.length) return false;
  logs = parsed;
  try { localStorage.setItem('waifuchan_logs_v9', JSON.stringify(logs)); } catch (e) {}
  document.getElementById('statusText').innerText = `✅ Загружено: ${logs.length} забросов (${sourceLabel})`;
  renderCalc(); renderRev(); renderDex();
  return true;
}

async function loadFromGoogleSheets() {
  const proxiedUrl = `${WORKER_URL}?url=${encodeURIComponent(PUBLISHED_CSV_URL)}&_=${Date.now()}`;
  try {
    const res = await fetch(proxiedUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const buf = await res.arrayBuffer();
    let txt = new TextDecoder("utf-8").decode(buf);
    let parsed = parseRawText(txt);
    if (!parsed.length) {
      txt = new TextDecoder("windows-1251").decode(buf);
      parsed = parseRawText(txt);
    }
    if (parsed.length) {
      applyData(parsed, "через воркер");
      return true;
    }
    console.warn("[воркер] пустой ответ");
  } catch (e) {
    console.warn("[воркер] не удалось:", e.message);
  }
  return false;
}

/* 3D-наклон карточек — только для устройств с мышью */
const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
if (hasHover) {
  document.addEventListener('mousemove', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform = `perspective(900px) rotateX(${-y * 6}deg) rotateY(${x * 6}deg) translateY(-3px)`;
    card.style.setProperty('--mx', `${(x + 0.5) * 100}%`);
    card.style.setProperty('--my', `${(y + 0.5) * 100}%`);
  });
  document.addEventListener('mouseout', e => {
    const card = e.target.closest && e.target.closest('.card');
    if (card && !card.contains(e.relatedTarget)) card.style.transform = '';
  }, true);
}

(async function init() {
  try {
    const saved = localStorage.getItem('waifuchan_logs_v9');
    if (saved) {
      logs = JSON.parse(saved);
      document.getElementById('statusText').innerText = `⚡ Из кэша: ${logs.length} забросов (обновление…)`;
      renderCalc(); renderRev(); renderDex();
    }
  } catch (e) {}

  const ok = await loadFromGoogleSheets();
  if (!ok && !logs.length) {
    document.getElementById('statusText').innerHTML =
      '⚠️ Воркер не отвечает. Проверь, что он задеплоен и URL правильный.';
  }
  renderCalc(); renderRev(); renderDex();
  setInterval(loadFromGoogleSheets, 60_000);
})();

document.addEventListener('error', function(e) {
  if (e.target && e.target.tagName === 'IMG') {
    const img = e.target;
    const alt = (img.alt || decodeURIComponent((img.src.split('/').pop() || '').replace(/\.webp.*$/i, ''))).trim();
    const em = EMOJI_MAP[alt] || "🐟";
    const box = img.parentElement;
    if (box) {
      box.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;">' + em + '</div>';
    }
  }
}, true);
